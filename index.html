<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff4d8">
  <title>Aventura da Letra V</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-mark">V</div>
      <div><p class="eyebrow">APRENDER BRINCANDO</p><h1>Aventura da Letra V</h1></div>
      <div class="score">⭐ <span id="score">0</span> pontos</div>
    </header>

    <nav class="progress" aria-label="Etapas do jogo">
      <div class="step active"><span>1</span><small>Encontre</small></div>
      <div class="step"><span>2</span><small>Pinte</small></div>
      <div class="step"><span>3</span><small>Figuras</small></div>
      <div class="step"><span>4</span><small>Sequência</small></div>
    </nav>

    <section class="game-card" id="game"></section>
    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
    <footer>✨ A leitura começa com uma descoberta de cada vez.</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
